[package]
name = "pc-build-simulator"
version = "0.1.0"
description = "PC Build Simulator — Faculdade Serra Dourada"
authors = ["Faculdade Serra Dourada"]
edition = "2021"

[lib]
# `_lib` evita conflito de nome com o binário no Windows (cargo#8519)
name = "pc_build_simulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
